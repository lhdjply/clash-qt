<!-- 更新：环形箭头
     24x24 线性图标：描边色写 currentColor，由运行时按主题替换
     （见 src/app/src/ui/Icons.cpp）

     箭头与弧线必须在同一个点上收口：早先的版本弧尾在 (17.6,6.4)、
     箭头角却在 (20,5)，两者不相接，缩到 14px 就只剩一个孤零零的钩子。
     这里描边加粗到 2px，缺口留在右上，折线正好接住弧尾。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1.06 6.67 2.86L21 8"/>
  <path d="M21 3v5h-5"/>
</svg>
