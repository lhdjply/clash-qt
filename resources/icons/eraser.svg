<!-- 擦除：橡皮（斜放，中间一道线分开胶芯与套筒）
     用 rotate 组摆放：圆角与分割线的几何关系不会随手写坐标走形
     24x24 线性图标：描边色写 currentColor，由运行时按主题替换
     （见 src/app/src/ui/Icons.cpp） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round">
  <g transform="rotate(-45 11.8 12.2)">
    <rect x="4.4" y="8.9" width="14.2" height="7.4" rx="1.5"/>
    <path d="M11 8.9v7.4"/>
  </g>
  <path d="M4.6 20.5h14.8"/>
</svg>
