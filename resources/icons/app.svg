<!-- 应用图标：渐变圆角方块 + 白色闪电（自绘，无外部素材）
     用于窗口与系统托盘；颜色自带，不参与主题替换 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.55" stop-color="#3B6EF5"/>
      <stop offset="1" stop-color="#7C5CF2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="24" height="24" rx="6.2" fill="url(#plate)"/>
  <rect x="0" y="0" width="24" height="24" rx="6.2" fill="url(#gloss)"/>
  <path d="M14.2 5.2 7.8 13.2h4.1l-.7 5.8 6.7-8.6h-4.1l.4-5.2z"
        fill="#ffffff" stroke="#ffffff" stroke-width="0.7" stroke-linejoin="round"/>
</svg>
