name: 构建

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# runner 固定 ubuntu-26.04：界面层用到 QStyleHints::colorScheme()（Qt 6.5+），
# ubuntu-24.04 自带的 Qt 6.4 编不过。若该镜像不可用，改用
# jurplel/install-qt-action 安装 Qt 6.8，并保留下面的版本检查步骤。
jobs:
  build:
    name: 构建 (Linux)
    runs-on: ubuntu-26.04

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v6
        with:
          # yaml-cpp / ml-kem / sha3 / randomshake / subtle 都是子模块；
          # 少拉任何一个，CMake 配置阶段就会直接 FATAL_ERROR
          submodules: recursive

      - name: 安装系统 Qt 与构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-charts-dev \
            qt6-svg-dev \
            libssl-dev

      - name: 打印实际使用的 Qt 版本
        run: |
          # 把版本打出来，便于对照「本地 6.8.0 上能过、CI 上为什么不行」
          pkg-config --modversion Qt6Core
          dpkg-query -W -f='${Package} ${Version}\n' qt6-base-dev qt6-charts-dev qt6-svg-dev

      - name: 校验 Qt 版本
        run: |
          version=$(pkg-config --modversion Qt6Core)
          # 界面层用到 QStyleHints::colorScheme()（Qt 6.5 引入）与 QtCharts。
          # 发行版 Qt 太旧时在这里明确失败，否则报出来的会是
          # "no member named 'colorScheme'"，看起来像代码写错了。
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::需要 Qt >= 6.5，当前为 $version。请升级 runner 的 Qt，或改用 jurplel/install-qt-action 安装 6.8。"
            exit 1
          fi

      - name: 配置
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCLASHQT_BUILD_TESTS=OFF

      - name: 构建
        run: cmake --build build --parallel
