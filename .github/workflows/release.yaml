name: 发布

on:
  push:
    branches: ['*']
    tags: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

# gh release create/upload 需要写权限；仓库默认 token 可能只有读
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: "clash-qt"
  BUILD_TYPE: "Release"

jobs:
  build-deb:
    name: 打包 (Linux deb)
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 在 x86_64 runner 上是原生速度；其余三个架构走 QEMU 仿真
          - platform: amd64
            image: linuxdeepin/deepin:crimson
          - platform: arm64
            image: linuxdeepin/deepin:crimson-arm64
          - platform: loong64
            image: linuxdeepin/deepin:crimson-loong64
          - platform: riscv64
            image: linuxdeepin/deepin:crimson-riscv64
    steps:
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 检出代码（含子模块）
        uses: actions/checkout@v6
        with:
          # 容器只挂载工作区，子模块必须在宿主侧先拉好
          submodules: recursive

      - name: 构建 ${{ matrix.platform }} 安装包
        run: |
          docker run --rm --platform linux/${{ matrix.platform }} -v ${{ github.workspace }}:/workspace \
            ${{ matrix.image }} \
            bash -c "
            set -e
            cd /workspace &&
            Jobs=\$(nproc) &&
            echo \"容器内 CPU 数：\$Jobs\" &&
            apt update &&
            apt install -y build-essential devscripts dh-make equivs &&
            mk-build-deps -i -t 'apt-get -y' './debian/control' &&
            DEB_BUILD_OPTIONS=\"parallel=\$Jobs\" debuild -us -uc -b &&
            cp ../*.deb ./
            "

      # 关于上面那个 -b：
      #   debian/source/format 是 3.0 (native)，不带 -b 也能构建；这里加 -b
      #   只是跳过源码包，CI 只需要安装包。
      #
      # 关于 parallel=N：
      #   dh_auto_build 只认 DEB_BUILD_OPTIONS 里的 parallel；debuild 不带 -j
      #   时是单线程。绝不能写成不带数字的 --parallel —— Make 生成器下 CMake
      #   会翻译成 `make -j`（无限并发），容器直接卡死。

      - name: 归集 deb 安装包
        run: |
          if ls ./*dbgsym*.deb 1> /dev/null 2>&1; then
            rm ./*dbgsym*.deb
          fi
          if ls ./*build-deps*.deb 1> /dev/null 2>&1; then
            rm ./*build-deps*.deb
          fi

          mkdir -p deb_package
          cp ./*.deb deb_package
          ls -l deb_package

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_linux_deb_${{ matrix.platform }}
          path: deb_package/*.deb
          if-no-files-found: error

  create-release:
    name: 发布 Release
    runs-on: ubuntu-26.04
    needs: [build-deb]
    # PR 只验证四个架构能不能打包，不建 Release
    if: github.event_name != 'pull_request'

    # 所有分支 / 标签的发布都会去删改同一个 continuous_build tag，
    # 顶层并发组是按 ref 分的，挡不住两个分支同时发版，这里再串行一次。
    concurrency:
      group: release-publish
      cancel-in-progress: false

    steps:
      # 发布说明来自仓库根目录的 VERSION 与 CHANGELOG.md，必须先检出代码。
      # 之前这一步漏了 checkout，工作区里只有 release 产物，于是
      # `sed VERSION` 直接报 No such file，awk 也读不到 CHANGELOG.md。
      - name: 检出代码（读取 VERSION / CHANGELOG.md）
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 计算 SHA-256 校验和
        run: |
          cd artifacts
          > hashes.sha256
          for file in $(find . -type f -name "*.deb"); do
            filename=$(basename "$file")
            sha256sum "$file" | awk -v fname="$filename" '{print $1 " *" fname}' >> hashes.sha256
          done
          cd ..
          tree artifacts

      # 发布说明的来源：
      #   正式版（打 tag）→ CHANGELOG.md 里对应版本的那一节，原样作为 Release 正文；
      #                   找不到（或忘了写）就退回 GitHub 自动生成的提交说明，
      #                   并打一条 warning，避免悄悄发出一版没有更新日志的 Release。
      #   持续构建       → 一小段说明 + 指向 CHANGELOG.md，不占用版本节。
      - name: 准备发布信息
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES_FILE"

          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"                     # v1.0.0 → 1.0.0

            # 缺文件时给一句人话，别让 sed / awk 抛 No such file 这种难懂的报错
            for f in VERSION CHANGELOG.md; do
              if [ ! -f "$f" ]; then
                echo "::error::仓库根目录缺少 $f，无法生成发布说明（检查是否漏了 checkout）"
                exit 1
              fi
            done

            FILE_VERSION="$(sed 's/^[vV]//' VERSION | tr -d '[:space:]')"

            # 发布前先对账：tag 和 VERSION 必须是同一个版本，否则会出现
            # 「tag 是 v1.0.1、deb 却叫 1.0.0」这种装上去还显示旧版本的情况
            if [ "$VERSION" != "$FILE_VERSION" ]; then
              echo "::error::tag（$TAG）与 VERSION（$(cat VERSION)）不一致，请先把 VERSION 改成 v$VERSION 再打 tag"
              exit 1
            fi

            echo "PRERELEASE=" >> $GITHUB_ENV
            echo "RELEASE_NAME=${{ env.APP_NAME }} $TAG" >> $GITHUB_ENV
            echo "TAG_NAME=$TAG" >> $GITHUB_ENV

            # 取 "## [<版本>]" 到下一个 "## [" 之间的内容，并去掉首尾空行。
            # 小节标题按 tag 写法带 v（## [v1.0.0]），这里 v 前缀可有可无，
            # 免得 VERSION / changelog 的写法互换时匹配不到。
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[v?" ver "\\]" { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { lines[++n] = $0 }
              END {
                first = 1
                while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
                while (n >= first && lines[n] ~ /^[[:space:]]*$/) n--
                for (i = first; i <= n; ++i) print lines[i]
              }
            ' CHANGELOG.md > "$NOTES_FILE"
          else
            echo "PRERELEASE=-p" >> $GITHUB_ENV
            echo "RELEASE_NAME=持续构建" >> $GITHUB_ENV
            echo "TAG_NAME=continuous_build" >> $GITHUB_ENV

            {
              echo "由 CI 自动生成，对应提交 [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})。"
              echo
              echo "完整更新日志见仓库根目录 [\`CHANGELOG.md\`](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md)。"
            } > "$NOTES_FILE"
          fi

          # 正式版必须带更新日志：宁可让 job 失败，也不要发出一版没有说明的 Release
          if [ ! -s "$NOTES_FILE" ]; then
            if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "::error::CHANGELOG.md 里没有 ## [v$VERSION]（或 ## [$VERSION]）小节，请补上再发版"
            else
              echo "::error::发布说明为空"
            fi
            exit 1
          fi

          # 不再把 "--notes-file /路径" 塞进 $GITHUB_ENV 再用表达式展开：
          # 那样一旦路径带空格就会拆成两个参数。下一步直接引用 $RUNNER_TEMP。
          echo "Release 正文：使用 $NOTES_FILE（$(wc -l < "$NOTES_FILE") 行）"

      - name: 创建 GitHub Release
        continue-on-error: false
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          deb_files=$(find artifacts -name "*.deb" -print0 | xargs -0 echo)
          hash_files=$(find artifacts -name "*.sha256" -print0 | xargs -0 echo)

          if [ -z "$deb_files" ]; then
            echo "::error::没有拿到任何 deb 产物，放弃发布。"
            exit 1
          fi

          # 同名 release 已存在就先删掉（continuous_build 连带删 tag）
          if gh release view ${{ env.TAG_NAME }} --repo $GITHUB_REPOSITORY &> /dev/null; then
            if [ "${{ env.TAG_NAME }}" == "continuous_build" ]; then
              gh release delete ${{ env.TAG_NAME }} --repo $GITHUB_REPOSITORY --cleanup-tag --yes
            else
              gh release delete ${{ env.TAG_NAME }} --repo $GITHUB_REPOSITORY --yes
            fi
            echo "已删除 ${{ env.TAG_NAME }}"
          fi

          gh release create ${{ env.TAG_NAME }} \
                            $deb_files \
                            $hash_files \
                            ${{ env.PRERELEASE }} \
                            --repo $GITHUB_REPOSITORY \
                            --title "${{ env.RELEASE_NAME }}" \
                            --notes-file "$NOTES_FILE"

          echo "已创建 release: ${{ env.TAG_NAME }}"
          echo "包含产物："
          echo "$deb_files"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
